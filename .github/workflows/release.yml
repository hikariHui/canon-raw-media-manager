name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整 tag/commit 历史，供 GitHub 生成 Release Notes
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi

          BODY=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="${{ github.sha }}" \
            --jq .body)

          DELIM="NOTES_EOF_$(openssl rand -hex 8)"
          {
            echo "body<<${DELIM}"
            printf '%s\n' "$BODY"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Build and create Draft Release
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 密钥生成时未设密码；GitHub 不允许空 Secret，故不配置 PASSWORD
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          args: --target aarch64-apple-darwin
          tagName: v__VERSION__
          releaseName: "Canon 媒体管理器 v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      # tauri-action@v1 会把 latest.json 的 url 写成 api.github.com/.../assets/{id}，
      # 客户端无 Token 下载会 403；公开仓库应改用 releases/download 直链。
      # 注意：releaseDraft=true 时 GET /releases/tags/{tag} 会 404，须用 releaseId。
      - name: Rewrite latest.json to public download URLs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.tauri.outputs.appVersion }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --clobber
          node <<'NODE'
          const fs = require('fs');
          const { execSync } = require('child_process');
          const tag = process.env.TAG;
          const repo = process.env.GITHUB_REPOSITORY;
          const releaseId = process.env.RELEASE_ID;
          if (!releaseId) {
            throw new Error('Missing RELEASE_ID from tauri-action');
          }
          const gh = (args) =>
            execSync(`gh api ${args}`, { encoding: 'utf8' });

          const assets = JSON.parse(
            gh(`repos/${repo}/releases/${releaseId}/assets --paginate`),
          );
          const byId = Object.fromEntries(assets.map((a) => [String(a.id), a.name]));
          const json = JSON.parse(fs.readFileSync('latest.json', 'utf8'));
          for (const platform of Object.values(json.platforms || {})) {
            const match = String(platform.url).match(/\/releases\/assets\/(\d+)/);
            if (!match) continue;
            const name = byId[match[1]];
            if (!name) {
              throw new Error(`No asset name for id ${match[1]}`);
            }
            platform.url = `https://github.com/${repo}/releases/download/${tag}/${name}`;
          }
          fs.writeFileSync('latest.json', JSON.stringify(json, null, 2) + '\n');
          console.log(fs.readFileSync('latest.json', 'utf8'));
          NODE
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
